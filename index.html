<style>
:root{--bg:#F3EDE3;--paper:#FBF8F3;--ink:#1C1916;--mut:#5F574E;--line:#D8CEC0;--acc:#9A4128;--soft:#EDE4D6}

html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Public Sans',Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:#F3EDE3;flex:none;flex-wrap:wrap}
header h1{font:600 17px/1.2 'EB Garamond',Georgia,serif;margin:0 auto 0 0;letter-spacing:.2px}

.btn:hover{background:#3A342E}.btn.on{background:#E59A78;color:#1C1916;border-color:#E59A78}

#panel{width:420px;flex:none;background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 60px}

.notes h4{color:#E59A78;margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.notes ul{margin:0;padding-left:18px}.notes li{margin:5px 0;line-height:1.45}.notes b{color:#fff}

.kid:hover{background:#F7F1E8}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.pnav button{flex:1;font:600 13px 'Public Sans',Arial,sans-serif;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;color:var(--ink)}

<script>
const D={"center": {"id": "c", "title": "Die unberechtigte Eigenbesitzerin", "sub": "Kapitel + Epilog · Gruppe 8", "text": ["Das vorletzte Kapitel erzählt den Abschied der Enkelin der Schriftstellerin vom Haus am See. Sie hat es nach der Wende vor Gericht verloren, schleicht sich aber noch einmal heimlich hinein. Der Epilog erzählt danach den Abriss des Hauses.", "<b>Leitfrage:<\/b> Wem gehört ein Ort, an dem man aufgewachsen ist – dem, der das Recht hat, oder dem, der die Erinnerung hat?"]}, "branches": [{"id": "b1", "title": "Figur & Herkunft", "task": "Aufgabe 1", "short": "Wer ist sie, woher kommt sie?", "intro": "Wer die Hauptfigur ist, aus welcher Familie sie stammt und wann sie lebt. Achtung: Ihr Geburtsjahr und das Jahr der Handlung nennt der Text nicht, beides lässt sich nur erschließen.", "kids": [{"t": "Kein Name", "text": ["Die Figur hat keinen Namen. Sie heißt nur „die unberechtigte Eigenbesitzerin“ bzw. „die ehemalige Hausherrin“ – also nach ihrem rechtlichen Status. Das gilt für fast alle Figuren im Roman."], "deutung": "Schon der Titel macht sie zu einem Fall aus der Akte: Das Recht bestimmt, wer sie ist. Ihre persönliche Geschichte (Kindheit, Erinnerung) steht im Gegensatz zu diesem Etikett – genau dieser Konflikt trägt das Kapitel."}, {"t": "Familienlinie", "text": ["<b>Großmutter:<\/b> die Schriftstellerin, aus dem sowjetischen Exil zurückgekehrt, bewohnte das Haus in der DDR-Zeit.", "<b>Vater:<\/b> im Exil geboren, war vier Jahre im Kinderheim, weil seine Eltern „an die kollektive Erziehung glaubten“. Er verachtet das Wort „Natur“ und fährt nach dem Rückgabeantrag nie wieder hinaus.", "<b>Enkelin:<\/b> verbringt als Kind alle Sommerferien im Haus."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„… die Sprache des Landes, in dem er geboren worden war“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Niemals hatte ihrem Vater viel an der Natur gelegen …“"]], "deutung": "Drei Generationen, drei Verhältnisse zum Ort: Die Großmutter findet hier nach dem Exil ein Zuhause, der Vater hat nie eine Bindung aufgebaut (Kinderheim, „Natur“-Verachtung), die Enkelin ist am stärksten gebunden. Interessant: Selbst der Vater vergleicht die Landschaft einmal mit dem Russisch seiner Kindheit – auch er hat also ein verdrängtes Heimatgefühl."}, {"t": "Geburtsjahr (erschlossen)", "flag": "Der Text nennt kein Geburtsjahr. Unsere Angabe ist ein begründeter Schluss, kein Zitat.", "text": ["Wahrscheinlich in den <b>1960er Jahren<\/b> geboren:", "• Der Vater ist im Exil (1930er/40er) geboren, sie gehört also zur nächsten Generation.", "• Ihre Kindheit verbringt sie in der DDR im Haus der Großmutter.", "• Beim Rückgabeverfahren nach der Wende ist sie längst erwachsen und arbeitet im Ausland."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Bis in die obere Etage war der Schwamm gewachsen, während sie im Ausland arbeitete …“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„… ihre sehr schöne Kindheit ihr, die längst erwachsen war …“"]]}, {"t": "Handlungszeit (erschlossen)", "flag": "Auch das Jahr der Handlung steht nicht im Text.", "text": ["Wahrscheinlich ein <b>Sommer Mitte der 2000er<\/b>:", "• Die Währungsunion 1990 liegt zurück („nach der Halbierung der ostdeutschen Konten“).", "• Das Haus wurde „vor neun Jahren“ ausgeräumt und stand danach „viele Jahre“ leer.", "• Es ist Sommer: „während der Sommer langsam zu Ende geht“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Verkaufen durften sie nicht …“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Alles, was an den zwei Wänden …“"]]}, {"t": "Biografische Skizze", "text": ["Sie ist die Enkelin der Schriftstellerin und hat als Kind alle Sommerferien im Haus am See verbracht. Nach dem Tod der Großmutter wird sie Miteigentümerin. Nach der Wende fordern die Erben der Frau des Architekten das Haus zurück, und sie verliert es nach einem langen Verfahren durch einen Vergleich. Bevor es verkauft und abgerissen wird, schleicht sie sich heimlich noch einmal hinein, putzt es und verabschiedet sich."]}]}, {"id": "b2", "title": "Ort & Erinnerung", "task": "Aufgabe 2", "short": "Wie kommt sie zum Haus, was bedeutet es?", "intro": "Wie die Enkelin zu dem Haus kommt und warum es für sie mehr ist als ein Gebäude.", "kids": [{"t": "Weg zum Haus", "text": ["Das Haus gehörte ihrer Großmutter. Nach deren Tod lässt der Vater sie „gleich als Miteigentümerin“ eintragen – er selbst will damit nichts zu tun haben."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Deshalb hatte sie sich nicht darüber gewundert …“"]]}, {"t": "Erinnerungsräume", "text": ["• <b>Vögelchenzimmer:<\/b> dort wohnt sie in allen Sommerferien ihrer Kindheit", "• <b>Schrank:<\/b> „die Geheimtür ihrer Kinderzeit“ ins Schrankzimmer der Großeltern", "• <b>Besenkammertür:<\/b> „der Garten Eden in zwölf quadratischen Kapiteln“", "• <b>Geruch:<\/b> Pfefferminz und Kampfer – noch immer wie bei der Großmutter"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Im Vögelchenzimmer, das sie ihre ganze Kindheit über …“"]]}, {"t": "Erinnerungsszenen", "text": ["• Fernsehabende, an denen die Großmutter „im bequemsten der Gartensessel“ saß", "• wie das Badehäuschen hangaufwärts versetzt wurde – sie und ihr Kinderfreund begleiteten die Arbeiter", "• der Tod der Großmutter: Sie sucht deren schönstes Nachthemd heraus und wäscht es"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Jetzt denkt sie daran, wie ihre Großmutter …“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Noch während ihre Großmutter im Sterben lag …“"]]}, {"t": "Haus als Gedächtnis", "text": ["Jeder Raum ist mit einer Erinnerung verknüpft, selbst Geräusche: das Knarren der Treppe „bei der zweiten, der fünfzehnten und der vorletzten Stufe“. Die Forschung beschreibt das Sommerhaus deshalb als „Speicher der Erinnerung“ (Uni Duisburg-Essen, Literarikon)."], "deutung": "Das Haus ist für sie kein Besitz, sondern ein Archiv ihrer Kindheit. Deshalb trifft sie der Verlust so stark: Mit dem Haus verschwindet der Ort, an dem ihre Erinnerungen „wohnen“."}, {"t": "„Sehr schönes Gefängnis“", "text": ["Ihr Mann sagt: „Du hast deine Zeit dort gehabt.“ Sie kann ihm nicht erklären, dass die vergangene Zeit, seit klar ist, dass sie dort nicht alt werden wird, „in ihrem Rücken zu wuchern begann“ – die Kindheit wächst ihr „über den Kopf“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Was willst du, hatte ihr Mann immer gesagt …“"]], "deutung": "Erst der drohende Verlust macht die Bindung übermächtig. Das Oxymoron „schönes Gefängnis“ zeigt die Ambivalenz: Die Erinnerung ist wertvoll und hält sie zugleich fest."}]}, {"id": "b3", "title": "Recht & Verlust", "task": "Aufgabe 3", "short": "Warum verliert sie das Haus?", "intro": "Was „unberechtigte Eigenbesitzerin“ bedeutet, wer das Haus zurückfordert und warum ihre Kindheit vor Gericht nichts zählt.", "kids": [{"t": "Begriff", "flag": "Das Infoblatt AB 3 zum Begriff lag uns nicht vor – die Erklärung stützt sich auf das BGB.", "text": ["<b>Eigenbesitzer<\/b> ist, wer eine Sache besitzt, als gehöre sie ihm (§ 872 BGB).", "<b>Unberechtigt<\/b> heißt: Ihm fehlt das gültige Eigentum.", "Sie lebt also wie eine Eigentümerin im Haus, rechtlich gehört es ihr aber nicht."], "deutung": "Der Titel ist ein Paradox: „Eigen“ und „unberechtigt“ zugleich. Gefühlt ist es ihr Haus, juristisch nicht – genau diese Spannung ist das Thema des Kapitels."}, {"t": "Rückübertragung", "text": ["Nach der Wende regelte das Vermögensgesetz (1990) offene Eigentumsfragen nach dem Grundsatz <b>„Rückgabe vor Entschädigung“<\/b>: Frühere Eigentümer oder ihre Erben bekamen ihr Eigentum zurück.", "Den Antrag stellen „die im Westen lebenden Erben der Frau des Architekten“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„… seit von den im Westen lebenden Erben …“"]]}, {"t": "Warum sie verliert", "text": ["• Der Kaufvertrag für das Gebäude aus der DDR ist nie wirksam geworden – damit fällt auch das Nutzungsrecht weg („Verliehen. Aufgehoben.“).", "• Ob sie das Haus ehrlich erworben hat, ist „nicht streiterheblich“.", "• Der Text nennt sogar die Anspruchsgrundlage: „Neun acht fünf BGB“ – § 985 BGB ist der Herausgabeanspruch des Eigentümers."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Das Nutzungsrecht teilt das Schicksal …“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Klagend: Herausgabe und Räumung …“"]], "deutung": "Vor Gericht zählt nur das Eigentum, nicht die gelebte Bindung. Ihre Kindheit ist juristisch irrelevant."}, {"t": "Geld & Investor", "text": ["Nach der „Halbierung der ostdeutschen Konten“ fehlt das Geld, um das Haus zu erhalten. Ein Investor beseitigt den Schwamm und deckt das Dach neu, gibt aber auf, als er das Haus nicht kaufen kann, kappt den Strom und lässt es halb aufgerissen stehen."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Der Investor hatte den Schwamm beseitigt …“"]]}, {"t": "Vergleich", "text": ["Am Ende steht kein Urteil, sondern ein Vergleich: Herausgabe und Räumung des Hauses „gegen geleistete Ausgleichszahlung“. Damit sind alle Ansprüche „abgegolten“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Klagend: Herausgabe und Räumung …“"]]}, {"t": "Kette der Verluste", "flag": "Die Vorgeschichte mit dem Architekten stammt aus früheren Kapiteln, nicht aus unserem.", "text": ["Schon in unserem Kapitel wird ein Uferstück „wieder der jüdischen Parzelle zugeschlagen“ – sie muss deshalb sogar den Unterpächtern kündigen.", "Aus den früheren Kapiteln wissen wir: Auch der Architekt kam an das Grundstück auf Kosten jüdischer Nachbarn, die später verfolgt wurden."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Vor einem halben Jahr hatte sie den Unterpächtern …“"]], "deutung": "Ihr Verlust ist nicht einzigartig, sondern das letzte Glied einer Kette von Enteignungen. Das erschwert ein einfaches Urteil (siehe Ast 8)."}]}, {"id": "b4", "title": "Die letzten Wochen", "task": "Aufgabe 4", "short": "Verkauf vs. Wiederherstellen", "intro": "Zwei gegensätzliche Bewegungen: Die Erben verkaufen das Haus als Ware – die Enkelin stellt heimlich ihre Kindheit wieder her.", "kids": [{"t": "Erben & Maklerin", "text": ["Die Erbengemeinschaft aus Österreich, der Schweiz und Westdeutschland lässt das Haus über eine Maklerin verkaufen; vor dem Küchenfenster hängt „Zu verkaufen“. Mal kommt das eine, mal das andere Mitglied, um „nach dem Rechten zu sehen“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Nach diesem ersten Besuch der Maklerin …“"]]}, {"t": "Haus als Ware", "text": ["Die Maklerin wirbt mit dem „besseren Ufer“ und den Sonnenuntergängen – und ausgerechnet damit, dass der Architekt „Mitglied der Gruppe Albert Speer“ war. Unter Denkmalschutz steht das Haus nicht. Ihre Provision: 6 % plus MwSt."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Das hier ist eindeutig das bessere Ufer …“"]], "deutung": "Was für die Enkelin Erinnerung ist, wird zum Verkaufsargument. Dass sogar die NS-Vergangenheit des Architekten als Werbung dient, zeigt bitter, wie Geschichte zur Ware wird."}, {"t": "Neue Eigentümer", "text": ["Beim letzten Besuch betreten die neuen Eigentümer und ihr Architekt das Haus nicht mehr. Sie deuten auf den See, das Badehaus und „auf den Platz, auf dem das Haus steht“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Sie hört die Autotüren der neuen Eigentümer …“"]], "deutung": "Nur der Platz zählt, nicht das Haus – der Abriss ist damit schon angekündigt."}, {"t": "Heimliche Rückkehr", "text": ["Sie kommt mit dem alten Schlüssel, den sie „von Rechts wegen“ längst hätte abgeben müssen, parkt oben an der Chaussee und schleicht durchs Gestrüpp. Sie schläft im Schrank des Vögelchenzimmers. Als die Maklerin Kunden durchs Haus führt und die Schranktür mit dem Spiegel öffnet („Und hier ist ein Spiegel“), liegt sie dahinter."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„An dem Morgen, an dem die Maklerin …“"]]}, {"t": "Wiederherstellen", "text": ["Sie putzt das ganze Haus, geht fünfmal zum See, um Wasser zu holen, hängt die Türen wieder ein, stellt den Tisch zurück, „wo er immer gestanden hat“, bohnert den Boden. Am Ende ist „alles, wie sie es immer gekannt hat“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Am nächsten Tag putzt sie die Fenster …“"]], "deutung": "Sie stellt nicht einfach ein Haus wieder her, sondern ihre Kindheit – ein letztes Mal, kurz bevor es zerstört wird. Gegenbewegung zur Maklerin: Erinnerung gegen Markt."}, {"t": "Abschiedsritual", "text": ["„Niemals ist der Hausfrieden größer gewesen“ als am letzten Tag. Der Text erinnert daran, dass das Fegen bei den Azteken „als eine heilige Handlung“ galt. Sie schließt „zurückweichend“ jede Tür, zuletzt die Haustür, und steckt den Schlüssel ein, „auch wenn der bald nur noch dazu da sein wird, Luft aufzuschließen“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Niemals ist der Hausfrieden größer gewesen …“"], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„… und steckt den abgegriffenen Schlüssel ein …“"]], "deutung": "Ironie: „Hausfrieden“ ist auch ein Rechtsbegriff – juristisch begeht sie „verbotene Eigenmacht“, erlebt aber den größten Frieden im Haus."}]}, {"id": "b5", "title": "Sprache & Erzählweise", "task": "Analyse", "short": "Wie wird erzählt?", "intro": "Wie Erpenbeck den Konflikt zwischen Recht und Erinnerung schon in der Sprache sichtbar macht.", "kids": [{"t": "Montage", "text": ["Erinnerung und Gerichts-/Grundbuchsprache stehen unvermittelt nebeneinander. Beispiel: Sie öffnet, „Zug um Zug gegen Räumung“ …, „verbotene Eigenmacht“, „die Geheimtür ihrer Kinderzeit“."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Im Vögelchenzimmer, das sie ihre ganze Kindheit über …“"]], "deutung": "Die Sprache spiegelt den Konflikt: Das Recht dringt bis in ihre intimsten Erinnerungen ein."}, {"t": "Ohne Anführungszeichen", "text": ["Die juristischen Fragmente sind nicht als Zitat gekennzeichnet; oft sind es bloße Satzfetzen („Unstreitig.“, „Bestandskraft.“, „Abgegolten.“)."], "deutung": "Wirkung wie ein Bewusstseinsstrom: Das Verfahren hat sich in ihr Denken eingeschrieben, sie kann es nicht abschalten."}, {"t": "Personales Erzählen", "text": ["Ein Er-/Sie-Erzähler bleibt nah an ihrer Wahrnehmung. Andere Figuren (Maklerin, Kundschaft) erleben wir nur über das, was sie aus dem Schrank hört."], "deutung": "Wir sind mit ihr eingeschlossen – das verstärkt die Spannung der Schrank-Szene."}, {"t": "Zeitebenen", "text": ["Die Gegenwart (die letzten Wochen) steht im <b>Präsens<\/b> („Und jetzt will sie noch einmal ins Haus gehen“), die Vorgeschichte im <b>Plusquamperfekt<\/b> („hatte sie sich nicht darüber gewundert“)."]}, {"t": "Ende im Amtsdeutsch", "text": ["Das Kapitel endet nicht mit ihr, sondern mit Fragmenten wie „Anlagenkonvolut B 3. Wir beantragen zu erkennen.“ – ein Satz, der abbricht."], "deutung": "Das Recht behält das letzte Wort; ihre Geschichte wird zur Akte."}]}, {"id": "b6", "title": "Schlüsselstelle: Schlingen", "task": "Aufgabe 6", "short": "Wer wird woran gebunden?", "intro": "„Wie mit Schlingen band die Zeit den Ort dort fest, wo er war …“ – die zentrale Bildstelle des Kapitels.", "kids": [{"t": "Wer an was?", "text": ["Die Zeit bindet …", "• den Ort fest, „wo er war“", "• die Erde an sich selbst", "• die Figur an diese Erde", "• sie und den Kinderfreund „für immer aneinander“ – obwohl sie ihn seit über neun Jahren nicht gesehen hat und ihm „wahrscheinlich nie wieder begegnen“ wird"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Wie mit Schlingen band die Zeit den Ort dort fest …“"]]}, {"t": "Umkehrung", "text": ["Grammatisch ist <b>die Zeit<\/b> das Subjekt, die Figur nur Objekt. Nicht sie hält den Ort fest, sondern sie wird festgehalten."], "deutung": "Sie ist dem Ort ausgeliefert – passend zum „sehr schönen Gefängnis“ direkt davor."}, {"t": "Doppeldeutigkeit", "text": ["Eine Schlinge verbindet – aber sie fängt auch (Falle, Stri log", "„Bevor auf demselben Platz ein anderes Haus gebaut werden wird …“"], ["Prolog", "„… wie jede Hohlform war auch diese Rinne …“"]], "deutung": "Der Rahmen stellt die Menschengeschichte in die Erdgeschichte: Besitz, Recht und Erinnerung sind vorübergehend, die Landschaft bleibt."}]}, {"id": "b8", "title": "Beurteilung", "task": "AFB III", "short": "Unsere Bewertung", "intro": "Wir beziehen Stellung: Was lässt der Text offen, und wie bewerten wir es?", "kids": [{"t": "Opfer oder „unberechtigt“?", "pro": "Sie hat nichts Unrechtes getan, das Haus redlich bewohnt und verliert ihre Kindheit an Erben, die es nur verkaufen.", "contra": "Das Haus hat eine Vorgeschichte von Enteignungen; auch ihre Familie profitierte von einer früheren Enteignung (Architekt). Das Ufer kehrt zur „jüdischen Parzelle“ zurück.", "urteil": "Sie ist subjektiv Opfer, objektiv aber nur das letzte Glied in einer Kette. Der Roman verweigert bewusst eine einfache Opferrolle."}, {"t": "Recht vs. Gerechtigkeit", "pro": "„Rückgabe vor Entschädigung“ versucht, altes Unrecht rückgängig zu machen – das ist grundsätzlich gerecht.", "contra": "Das Recht fragt nicht nach gelebter Bindung („nicht streiterheblich“). Am Ende gewinnt nicht die Erinnerung, sondern der Markt: verkauft, abgerissen.", "urteil": "Rechtlich korrekt, menschlich unbefriedigend. Erpenbeck zeigt, dass Recht und Gerechtigkeit nicht dasselbe sind."}, {"t": "Abschied oder Festklammern?", "pro": "Das Putzen ist ein Ritual (Azteken: „heilige Handlung“), sie gibt am Ende den Ort frei und schließt ab.", "contra": "Sie bricht das Recht („verbotene Eigenmacht“), versteckt sich im Schrank und behält den Schlüssel.", "urteil": "Beides: Sie verabschiedet sich vom Haus, aber nicht von der Bindung – genau das sagt das Schlingen-Bild."}, {"t": "Ende: Trost oder Gleichgültigkeit?", "pro": "Die Landschaft „gleicht … wieder sich selbst“ – alles kehrt zum Ursprung zurück, ein ruhiger Schluss.", "contra": "Die Natur ist gleichgültig gegenüber den Menschen;  panel.innerHTML=`<p class="crumb" style="color:${b.c}">Ast ${b.k+1} <span class="tag" style="background:${b.c}">${esc(b.task)}</span></p><h2>${esc(b.title)}</h2><p>${b.intro}</p>${notesBox(b.notes)}
 <div class="kids">${b.kids.map((k,j)=>`<button class="kid" style="--c:${b.c}" onclick="go('${b.id}-${j}')">${esc(k.t)}</button>`).join('')}</div>${pnav()}${foot}`}
function renderKid(bi,j){const b=B[bi],k=b.kids[j];let h=`<p class="crumb" style="color:${b.c}">Ast ${b.k+1} · ${esc(b.title)} <span class="tag" style="background:${b.c}">${esc(b.task)}</span></p><h2>${esc(k.t)}</h2>`;
 if(k.flag)h+=`<div class="box flag"><h4>⚠ Hinweis</h4>${esc(k.flag)}</div>`;
 if(k.text)h+=k.text.map(t=>`<p>${t}</p>`).join('');
 if(k.pro)h+=`<div class="box pro"><h4>Dafür spricht</h4>${esc(k.pro)}</div>`;
 if(k.contra)h+=`<div class="box con"><h4>Dagegen spricht</h4>${esc(k.contra)}</div>`;
 if(k.urteil)h+=`<div class="box urt"><h4>Unser Urteil</h4>${esc(k.urteil)}</div>`;
 if(k.belege)h+=`<div class="box bel"><h4>Belege</h4><ul>${k.belege.map(([kp,z])=>`<li>${esc(kp)}, ${esc(z)}</li>`).join('')}</ul></div>`;
 if(k.deutung)h+=`<div class="box deut"><h4>Deutung</h4>${esc(k.deutung)}</div>`;
 h+=`<p style="margin-top:12px"><a href="#${b.id}" onclick="go('${b.id}');return false" style="color:${b.c};font-weight:600">↑ Zurück zu Ast ${b.k+1}</a></p>`+pnav()+foot;panel.innerHTML=h}
function showRel(id){const n=RN[id];Object.entries(relG).forEach(([k,g])=>g._r.setAttribute('stroke-width',k===id?6:(k==='enk'?0:2)));
 const es=D.rel.edges.filter(e=>e[0]===id||e[1]===id).map(([a,b,l])=>`<li><b>${esc(RN[a===id?b:a][1])}</b>: ${esc(l)}</li>`).join('');
 panel.innerHTML=`<p class="crumb">Beziehungen</p><h2>${esc(n[1])}</h2>${n[2]?`<p style="color:var(--mut);margin-top:-6px">${esc(n[2])}</p>`:''}<p>${esc(n[3])}</p>${es?`<div class="box bel"><h4>Verbindungen</h4><ul>${es}</ul></div>`:''}${foot}`;
 panel.scrollTop=0;document.body.classList.remove('collapsed')}
function relIntro(){panel.innerHTML=`<p class="crumb">Beziehungen</p><h2>Figurenkonstellation</h2><p>Links steht die Familie, aus der die Enkelin kommt, rechts die Gegenseite, die das Haus zurückbekommt und verkauft. Oben steht die Vorgeschichte.</p><p>Klicke auf eine Figur, um mehr zu erfahren.</p><div class="box flag"><h4>⚠ Hinweis</h4>Der Architekt selbst tritt in unserem Kapitel nicht auf. Seine Rolle stammt aus früheren Kapiteln.</div>${foot}`}
function setView(v,quiet){view=v;document.getElementById('tMap').classList.toggle('on',v==='map');document.getElementById('tRel').classList.toggle('on',v==='rel');
 const m=v==='map';[gEdges,gKids,gBr,center].forEach(g=>g.style.display=m?'':'none');gRel.style.display=m?'none':'';
 if(!m){const pts=D.rel.nodes.map(n=>[n[4],n[5]]);setVB(bbox(pts,190));relIntro();try{history.replaceState(null,'','#beziehungen')}catch(e){}}
 else if(!quiet)go(cur)}
document.getElementById('tMap').onclick=()=>setView('map');document.getElementById('tRel').onclick=()=>setView('rel');
document.getElementById('home').onclick=()=>go('c');document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('close').onclick=()=>document.body.classList.toggle('collapsed');
if(PRESENTER){const t=document.getElementById('tNotes');t.style.display='';t.classList.toggle('on',showNotes);t.onclick=()=>{showNotes=!showNotes;t.classList.toggle('on',showNotes);if(view==='map')go(cur,true)}}
svg.addEventListener('click',()=>{if(view==='map'&&cur!=='c'){const b=cur.split('-')[0];go(cur.includes('-')?b:'c')}});
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();step(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1)}else if(e.key==='Escape')go('c');
 else if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('node')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:false}))}});
function fromHash(){const h=(location.hash||'').slice(1);if(h==='beziehungen')setView('rel');else if(h&&(h==='c'||SEQ.includes(h)))go(h,true);else go('c',true)}
addEventListener('hashchange',fromHash);
new ResizeObserver(()=>{if(view==='rel')setVB(bbox(D.rel.nodes.map(n=>[n[4],n[5]]),190));else go(cur,true)}).observe(svg);
svg.setAttribute('viewBox',vb.join(' '));fromHash();
</script>
