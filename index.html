<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die unberechtigte Eigenbesitzerin – Mindmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">

<style>
:root{
 --paper:#EDF0EA; --sheet:#FBFCF9; --ink:#13263A; --ink2:#41505E; --rule:#CDD5CC;
 --pine:#2F5D4E; --lake:#2D6A88; --stamp:#A3262E; --sand:#8A6A2F;
 --ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--ui)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* header */
header{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.brand{margin-right:auto;min-width:0}
.brand b{display:block;font:600 19px/1.15 var(--read);letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.seg{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:13.5px;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tools{display:flex;gap:6px}
.ib{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font-weight:600;font-size:13.5px;height:34px;min-width:34px;padding:0 11px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{background:#F1F4EF}
.ib[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ib svg{width:16px;height:16px}
button:focus-visible,.node:focus-visible{outline:3px solid var(--lake);outline-offset:2px}


main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.node{cursor:pointer;outline:none}
.node .bg{transition:stroke-width .18s ease,fill .18s ease}
.node:hover .bg{fill:#fff}
.node text{pointer-events:none}
.layer{transition:opacity .35s ease}
.gone{opacity:0;pointer-events:none}
.faint{opacity:.22}
.legend{position:absolute;z-index:2;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);background:rgba(237,240,234,.85);padding:6px 10px;border-radius:8px;max-width:calc(100% - 28px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

/* panel */
#panel{flex:none;width:440px;background:var(--sheet);border-left:1px solid var(--rule);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pi{padding:24px 28px 56px;max-width:62ch}
.pi .crumb{font:600 13px/1.35 var(--ui);margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;border:1.5px solid currentColor;border-radius:20px;padding:1px 8px}
.pi h2{font:600 30px/1.12 var(--read);letter-spacing:-.01em;margin:0 0 14px}
.pi p{font:400 16.5px/1.62 var(--read);margin:0 0 12px}
.pi ul.dots{margin:0 0 12px;padding:0;list-style:none}
.pi ul.dots li{font:400 16.5px/1.55 var(--read);padding-left:18px;position:relative;margin:0 0 7px}
.pi ul.dots li:before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--ink))}
.pi .lbl{font:600 13px/1.3 var(--ui);margin:0 0 6px;color:var(--ink2);font-style:normal}
.blk{margin:18px 0}
.deut{border-left:3px solid var(--c,var(--ink));padding:2px 0 2px 14px}
.pi .deut p:not(.lbl){font-style:italic}
.bel ol{margin:0;padding-left:20px;font:400 14.5px/1.5 var(--read);color:var(--ink2)}
.bel li{margin:0 0 5px}
.flag{border:1.5px dashed var(--stamp);border-radius:8px;padding:10px 12px;color:#5E1419;background:#FBF1F1}
.pi .flag .lbl{color:var(--stamp)}
.pi .flag p{font-size:15px;margin:0}
.pc{display:grid;grid-template-columns:1fr;gap:10px}
.pc>div{border-radius:8px;padding:11px 13px}
.pc .pro{background:#E8F0EC}.pi .pc .pro .lbl{color:var(--pine)}
.pc .con{background:#F7EAEA}.pi .pc .con .lbl{color:var(--stamp)}
.pi .pc p{font-size:15.5px;margin:0}
.verdict{background:var(--ink);color:#F2F5F1;border-radius:8px;padding:13px 15px}
.pi .verdict .lbl{color:#A9C7D6}.pi .verdict p{margin:0}
.notes{background:#13263A;color:#EEF2EE;border-radius:10px;padding:14px 16px}
.pi .notes .lbl{color:#A9C7D6}
.notes ul{margin:0;padding-left:18px}.notes li{font:400 15px/1.5 var(--ui);margin:0 0 7px}.notes b{color:#fff}
.kids{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.kid{display:flex;align-items:baseline;gap:10px;text-align:left;font:600 15px/1.3 var(--ui);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;cursor:pointer}
.kid:hover{background:#F1F4EF;border-color:var(--c)}
.kid small{font:500 12.5px var(--ui);color:var(--ink2);margin-left:auto;white-space:nowrap}
.kid i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);transform:translateY(-1px)}
.branches{display:grid;grid-template-columns:1fr;gap:6px;margin:14px 0}
.brb{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--rule);background:transparent;border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.brb:hover{background:#F1F4EF}
.brb em{flex:none;position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 11%,transparent)}
.brb em b{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font:700 10.5px/18px var(--ui);text-align:center;border:2px solid var(--sheet)}
.phead{display:flex;align-items:center;gap:12px;margin:0 0 10px}.phead .crumb{margin:0!important}
.ptile{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 11%,transparent)}
.pi .lbl svg{vertical-align:-2px;margin-right:3px}
/* timeline */
#tl{position:absolute;inset:0;overflow:auto;display:none;z-index:1;-webkit-overflow-scrolling:touch}
#tl.on{display:flex;align-items:center}
#tl .track{display:flex;align-items:flex-start;padding:40px 48px 90px;margin:auto 0}
.st{position:relative;flex:none;width:178px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:transparent;border:0;cursor:pointer;color:var(--ink);padding:0 10px}
.st:not(:last-child):after{content:"";position:absolute;top:34px;left:50%;width:100%;height:2px;background:var(--c);opacity:.4}
.st .dot{position:relative;z-index:1;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:2px solid var(--c);transition:transform .18s ease,background .18s ease}
.st:hover .dot{transform:scale(1.06)}
.st.sel .dot{background:var(--c)}.st.sel .dot svg{stroke:#fff}
.st .tx{display:flex;flex-direction:column;align-items:center;gap:3px}
.st .n{font:700 12px var(--ui);color:var(--c)}
.st .when{font:italic 400 14px/1.3 var(--read);color:var(--ink2)}
.st .when.ers{text-decoration:underline dotted 1.5px;text-underline-offset:3px}
.st .ttl{font:600 16px/1.25 var(--ui)}
.st.sel .ttl{color:var(--c)}
.tlnote{position:absolute;right:14px;bottom:12px;font-size:12.5px;color:var(--ink2);background:rgba(237,240,234,.9);padding:6px 10px;border-radius:8px;margin:0}
.tlnote u{text-decoration:underline dotted 1.5px;text-underline-offset:3px}
@media (max-width:860px),(max-aspect-ratio:1/1){
 #tl.on{display:block}
 #tl .track{flex-direction:column;padding:20px 16px 40px;margin:0}
 .st{width:auto;margin:0;padding:0 0 18px;flex-direction:row;text-align:left;align-items:flex-start;gap:14px}
 .st:not(:last-child):after{top:56px;left:27px;width:2px;height:calc(100% - 56px)}
 .st .dot{width:56px;height:56px;flex:none}
 .st .tx{align-items:flex-start;padding-top:4px}
 .tlnote{display:none}
}
}

.brb span{font:600 15px/1.25 var(--ui)}.brb span small{display:block;font:italic 400 13.5px/1.3 var(--read);color:var(--ink2);margin-top:2px}
.pnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}
.pnav button{text-align:left;border:1px solid var(--rule);background:transparent;border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink);font:600 14px/1.3 var(--ui)}
.pnav button small{display:block;font:500 12px var(--ui);color:var(--ink2);margin-bottom:2px}
.pnav button.nx{text-align:right;grid-column:2}
.pnav button:hover{background:#F1F4EF}
.up{display:inline-block;margin-top:6px;font:600 14px var(--ui);color:var(--c);text-decoration:none;border-bottom:1.5px solid currentColor}
.pi .foot{font-family:var(--ui);margin-top:30px;padding-top:10px;border-top:1px solid var(--rule);font-size:12px;line-height:1.5;color:var(--ink2)}

@media (max-width:860px){
 header{flex-wrap:wrap;gap:6px 6px;padding:8px 10px}
 .brand{flex:1 1 100%}
 .brand b{font-size:17px}.brand span{display:none}
 .seg button{padding:5px 8px;font-size:13px}
 .tools{margin-left:auto;gap:5px}
 .ib{height:32px;min-width:32px;padding:0 9px}
 main{flex-direction:column}
 #panel{width:auto;height:46%;border-left:0;border-top:1px solid var(--rule)}
 
 .pi{padding:16px 18px 44px}
 .pi h2{font-size:25px}
 .legend{display:none}
}
body.min #panel{display:none}
@media (max-width:1280px) and (min-width:861px){#panel{width:390px}}
@media (prefers-reduced-motion:reduce){.layer,.node .bg{transition:none}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="brand"><b>Die unberechtigte Eigenbesitzerin</b><span>Mindmap von Gruppe 8 zu Jenny Erpenbecks „Heimsuchung“</span></div>
 <div class="seg" role="group" aria-label="Ansicht"><button id="vMap" aria-pressed="true">Mindmap</button><button id="vTl" aria-pressed="false">Zeitstrahl</button><button id="vRel" aria-pressed="false">Beziehungen</button></div>
 <div class="tools">
  <button class="ib" id="home" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 7.2 8 2.5l5.5 4.7V13a.5.5 0 0 1-.5.5H9.6V9.8H6.4v3.7H3a.5.5 0 0 1-.5-.5z"/></svg></button>
  <button class="ib" id="prev" aria-label="Zurück"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
  <button class="ib" id="next" aria-label="Weiter"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
  <button class="ib" id="timerBtn" hidden title="Stoppuhr starten oder anhalten" style="font-variant-numeric:tabular-nums;min-width:62px">0:00</button><button class="ib" id="notesBtn" aria-pressed="true" hidden>Notizen</button>
  <button class="ib" id="sheetBtn" aria-pressed="false">Text</button>
 </div>
</header>
<main>
 <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mindmap"></svg>
  <div class="legend" id="legend"></div><div id="tl" role="list" aria-label="Zeitstrahl"></div></div>
 <aside id="panel" aria-live="polite"><div class="pi" id="pi"></div></aside>
</main>
</div>
<pre id="audit" hidden></pre>
<script>
const D={"center": {"id": "c", "title": "Die unberechtigte Eigenbesitzerin", "sub": "Kapitel und Epilog", "text": ["Das vorletzte Kapitel erzählt den Abschied der Enkelin der Schriftstellerin vom Haus am See. Sie hat es nach der Wende vor Gericht verloren, schleicht sich aber noch einmal heimlich hinein. Der Epilog erzählt danach den Abriss des Hauses.", "<b>Leitfrage:<\/b> Wem gehört ein Ort, an dem man aufgewachsen ist – dem, der das Recht hat, oder dem, der die Erinnerung hat?"]}, "branches": [{"id": "b1", "title": "Figur & Herkunft", "task": "Aufgabe 1", "short": "Wer ist sie, woher kommt sie?", "intro": "Wer die Hauptfigur ist, aus welcher Familie sie stammt und wann sie lebt. Achtung: Ihr Geburtsjahr und das Jahr der Handlung nennt der Text nicht, beides lässt sich nur erschließen.", "kids": [{"t": "Kein Name", "text": ["Die Figur hat keinen Namen. Sie heißt nur „die unberechtigte Eigenbesitzerin“ bzw. „die ehemalige Hausherrin“ (S. 181) – also nach ihrem rechtlichen Status. Das gilt für fast alle Figuren im Roman."], "deutung": "Schon der Titel macht sie zu einem Fall aus der Akte: Das Recht bestimmt, wer sie ist. Ihre persönliche Geschichte (Kindheit, Erinnerung) steht im Gegensatz zu diesem Etikett – genau dieser Konflikt trägt das Kapitel."}, {"t": "Familienlinie", "text": ["<b>Großmutter:<\/b> die Schriftstellerin, aus dem sowjetischen Exil zurückgekehrt, bewohnte das Haus in der DDR-Zeit.", "<b>Vater:<\/b> im Exil geboren, war vier Jahre im Kinderheim, weil seine Eltern „an die kollektive Erziehung glaubten“ (S. 175). Er verachtet das Wort „Natur“ (S. 174) und fährt nach dem Rückgabeantrag nie wieder hinaus.", "<b>Enkelin:<\/b> verbringt als Kind alle Sommerferien im Haus."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„… die Sprache des Landes, in dem er geboren worden war“", 175], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Niemals hatte ihrem Vater viel an der Natur gelegen …“", 174]], "deutung": "Drei Generationen, drei Verhältnisse zum Ort: Die Großmutter findet hier nach dem Exil ein Zuhause, der Vater hat nie eine Bindung aufgebaut (Kinderheim, „Natur“ (S. 174)-Verachtung), die Enkelin ist am stärksten gebunden. Interessant: Selbst der Vater vergleicht die Landschaft einmal mit dem Russisch seiner Kindheit – auch er hat also ein verdrängtes Heimatgefühl."}, {"t": "Geburtsjahr (erschlossen)", "flag": "Der Text nennt kein Geburtsjahr. Unsere Angabe ist ein begründeter Schluss, kein Zitat.", "text": ["Wahrscheinlich in den <b>1960er Jahren<\/b> geboren:", "• Der Vater ist im Exil (1930er/40er) geboren, sie gehört also zur nächsten Generation.", "• Ihre Kindheit verbringt sie in der DDR im Haus der Großmutter.", "• Beim Rückgabeverfahren nach der Wende ist sie längst erwachsen und arbeitet im Ausland."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Bis in die obere Etage war der Schwamm gewachsen, während sie im Ausland arbeitete …“", 174], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„… ihre sehr schöne Kindheit ihr, die längst erwachsen war …“", 183]]}, {"t": "Handlungszeit (erschlossen)", "flag": "Auch das Jahr der Handlung steht nicht im Text.", "text": ["Wahrscheinlich ein <b>Sommer Mitte der 2000er<\/b>:", "• Die Währungsunion 1990 liegt zurück („nach der Halbierung der ostdeutschen Konten“ (S. 174)).", "• Das Haus wurde „vor neun Jahren“ (S. 173) ausgeräumt und stand danach leer, „während der vielen Jahre“ (S. 175) des Verfahrens.", "• Es ist Sommer: „während der Sommer langsam zu Ende geht“ (S. 182)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Verkaufen durften sie nicht …“", 174], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Alles, was an den zwei Wänden …“", 173]]}, {"t": "Biografische Skizze", "text": ["Sie ist die Enkelin der Schriftstellerin und hat als Kind alle Sommerferien im Haus am See verbracht. Nach dem Tod der Großmutter wird sie Miteigentümerin. Nach der Wende fordern die Erben der Frau des Architekten das Haus zurück, und sie verliert es nach einem langen Verfahren durch einen Vergleich. Bevor es verkauft und abgerissen wird, schleicht sie sich heimlich noch einmal hinein, putzt es und verabschiedet sich."]}]}, {"id": "b2", "title": "Ort & Erinnerung", "task": "Aufgabe 2", "short": "Wie kommt sie zum Haus, was bedeutet es?", "intro": "Wie die Enkelin zu dem Haus kommt und warum es für sie mehr ist als ein Gebäude.", "kids": [{"t": "Weg zum Haus", "text": ["Das Haus gehörte ihrer Großmutter. Nach deren Tod lässt der Vater sie „gleich als Miteigentümerin“ (S. 174) eintragen – er selbst will damit nichts zu tun haben."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Deshalb hatte sie sich nicht darüber gewundert …“", 174]]}, {"t": "Erinnerungsräume", "text": ["• <b>Vögelchenzimmer:<\/b> dort wohnt sie in allen Sommerferien ihrer Kindheit", "• <b>Schrank:<\/b> „die Geheimtür ihrer Kinderzeit“ (S. 177) ins Schrankzimmer der Großeltern", "• <b>Besenkammertür:<\/b> „der Garten Eden in zwölf quadratischen Kapiteln“ (S. 173)", "• <b>Geruch:<\/b> Pfefferminz und Kampfer – noch immer wie bei der Großmutter"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Im Vögelchenzimmer, das sie ihre ganze Kindheit über …“", 176]]}, {"t": "Erinnerungsszenen", "text": ["• Fernsehabende, an denen die Großmutter „im bequemsten der Gartensessel“ (S. 176) saß", "• wie das Badehäuschen hangaufwärts versetzt wurde – sie und ihr Kinderfreund begleiteten die Arbeiter", "• der Tod der Großmutter: Sie sucht deren schönstes Nachthemd heraus und wäscht es"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Jetzt denkt sie daran, wie ihre Großmutter …“", 181], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Noch während ihre Großmutter im Sterben lag …“", 184]]}, {"t": "Haus als Gedächtnis", "text": ["Jeder Raum ist mit einer Erinnerung verknüpft, selbst Geräusche: das Knarren der Treppe „bei der zweiten, der fünfzehnten und der vorletzten Stufe“ (S. 181). Die Forschung beschreibt das Sommerhaus deshalb als „Speicher der Erinnerung“ (Uni Duisburg-Essen, Literarikon)."], "deutung": "Das Haus ist für sie kein Besitz, sondern ein Archiv ihrer Kindheit. Deshalb trifft sie der Verlust so stark: Mit dem Haus verschwindet der Ort, an dem ihre Erinnerungen hängen."}, {"t": "„Sehr schönes Gefängnis“", "text": ["Ihr Mann sagt: „Du hast deine Zeit dort gehabt.“ (S. 183) Sie kann ihm nicht erklären, dass die vergangene Zeit, seit klar ist, dass sie dort nicht alt werden wird, „in ihrem Rücken zu wuchern begann“ (S. 183) – die Kindheit wächst ihr „über den Kopf“ (S. 183) und erweist sich als „sehr schönes Gefängnis“ (S. 183)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Was willst du, hatte ihr Mann immer gesagt …“", 183]], "deutung": "Erst der drohende Verlust macht die Bindung übermächtig. Das Oxymoron „schönes Gefängnis“ (S. 183) zeigt die Ambivalenz: Die Erinnerung ist wertvoll und hält sie zugleich fest."}]}, {"id": "b3", "title": "Recht & Verlust", "task": "Aufgabe 3", "short": "Warum verliert sie das Haus?", "intro": "Was „unberechtigte Eigenbesitzerin“ bedeutet, wer das Haus zurückfordert und warum ihre Kindheit vor Gericht nichts zählt.", "kids": [{"t": "Begriff", "flag": "Das Infoblatt AB 3 zum Begriff lag uns nicht vor – die Erklärung stützt sich auf das BGB.", "text": ["<b>Eigenbesitzer<\/b> ist, wer eine Sache besitzt, als gehöre sie ihm (§ 872 BGB).", "<b>Unberechtigt<\/b> heißt: Ihm fehlt das gültige Eigentum.", "Sie lebt also wie eine Eigentümerin im Haus, rechtlich gehört es ihr aber nicht."], "deutung": "Der Titel ist ein Paradox: „Eigen“ und „unberechtigt“ zugleich. Gefühlt ist es ihr Haus, juristisch nicht – genau diese Spannung ist das Thema des Kapitels."}, {"t": "Rückübertragung", "text": ["Nach der Wende regelte das Vermögensgesetz (1990) offene Eigentumsfragen nach dem Grundsatz <b>„Rückgabe vor Entschädigung“<\/b>: Frühere Eigentümer oder ihre Erben bekamen ihr Eigentum zurück.", "Den Antrag stellen „die im Westen lebenden Erben der Frau des Architekten“ (S. 175)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„… seit von den im Westen lebenden Erben …“", 175]]}, {"t": "Warum sie verliert", "text": ["• Der Kaufvertrag für das Gebäude aus der DDR ist nie wirksam geworden – damit fällt auch das Nutzungsrecht weg („Verliehen. Aufgehoben.“ (S. 175)).", "• Ob sie das Haus ehrlich erworben hat, ist „nicht streiterheblich“ (S. 172).", "• Der Text nennt sogar die Anspruchsgrundlage: „Neun acht fünf BGB“ (S. 172) – § 985 BGB ist der Herausgabeanspruch des Eigentümers."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Das Nutzungsrecht teilt das Schicksal …“", 175], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Klagend: Herausgabe und Räumung …“", 172]], "deutung": "Vor Gericht zählt nur das Eigentum, nicht die gelebte Bindung. Ihre Kindheit ist juristisch irrelevant."}, {"t": "Geld & Investor", "text": ["Nach der „Halbierung der ostdeutschen Konten“ (S. 174) fehlt das Geld, um das Haus zu erhalten. Der Investor, dem der Vater „die Spekulation mit dem offiziell noch ihnen gehörenden Haus“ (S. 174) angeboten hatte, beseitigt den Schwamm und deckt das Dach neu, gibt aber auf, als er das Haus nicht kaufen kann, kappt den Strom und lässt es halb aufgerissen stehen."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Der Investor hatte den Schwamm beseitigt …“", 176]]}, {"t": "Vergleich", "text": ["Am Ende steht kein Urteil, sondern ein Vergleich: Herausgabe und Räumung des Hauses „gegen geleistete Ausgleichszahlung“ (S. 172). Der Abschnitt endet mit dem Wort „Abgegolten.“ (S. 173)"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Klagend: Herausgabe und Räumung …“", 172]]}, {"t": "Kette der Verluste", "flag": "Die Vorgeschichte mit dem Architekten stammt aus früheren Kapiteln, nicht aus unserem.", "text": ["Schon in unserem Kapitel wird ein Uferstück „wieder der jüdischen Parzelle zugeschlagen“ (S. 178) – sie muss deshalb sogar den Unterpächtern kündigen.", "Aus den früheren Kapiteln wissen wir: Auch der Architekt kam an das Grundstück auf Kosten jüdischer Nachbarn, die später verfolgt wurden."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Vor einem halben Jahr hatte sie den Unterpächtern …“", 178]], "deutung": "Ihr Verlust ist nicht einzigartig, sondern das letzte Glied einer Kette von Enteignungen. Das erschwert ein einfaches Urteil (siehe Ast 8)."}]}, {"id": "b4", "title": "Die letzten Wochen", "task": "Aufgabe 4", "short": "Verkauf vs. Wiederherstellen", "intro": "Zwei gegensätzliche Bewegungen: Die Erben verkaufen das Haus als Ware – die Enkelin stellt heimlich ihre Kindheit wieder her.", "kids": [{"t": "Erben & Maklerin", "text": ["Die Erbengemeinschaft aus Österreich, der Schweiz und Westdeutschland lässt das Haus über eine Maklerin verkaufen; vor dem Küchenfenster hängt „Zu verkaufen“ (S. 181). Mal kommt das eine, mal das andere Mitglied, um „nach dem Rechten zu sehen“ (S. 182)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Nach diesem ersten Besuch der Maklerin …“", 181]]}, {"t": "Haus als Ware", "text": ["Die Maklerin wirbt: „Das hier ist eindeutig das bessere Ufer“ (S. 180), wegen der Sonnenuntergänge – und ausgerechnet damit, dass der Architekt „Mitglied der Gruppe Albert Speer“ (S. 180) war. Unter Denkmalschutz steht das Haus nicht. Ihre Provision: „6% der Kaufsumme zuzüglich MwSt.“ (S. 183)"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Das hier ist eindeutig das bessere Ufer …“", 180]], "deutung": "Was für die Enkelin Erinnerung ist, wird zum Verkaufsargument. Dass sogar die NS-Vergangenheit des Architekten als Werbung dient, zeigt bitter, wie Geschichte zur Ware wird."}, {"t": "Neue Eigentümer", "text": ["Beim letzten Besuch betreten die neuen Eigentümer und ihr Architekt das Haus nicht mehr. Sie deuten auf den See, das Badehaus und „auf den Platz, auf dem das Haus steht“ (S. 183)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Sie hört die Autotüren der neuen Eigentümer …“", 183]], "deutung": "Nur der Platz zählt, nicht das Haus – der Abriss ist damit schon angekündigt."}, {"t": "Heimliche Rückkehr", "text": ["Sie kommt mit dem alten Schlüssel, den sie „von Rechts wegen“ (S. 173) längst hätte abgeben müssen, parkt oben an der Chaussee und schleicht durchs Gestrüpp. Sie schläft im Schrank des Vögelchenzimmers. Als die Maklerin Kunden durchs Haus führt und die Schranktür mit dem Spiegel öffnet („Und hier ist ein Spiegel“ (S. 179)), liegt sie dahinter."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„An dem Morgen, an dem die Maklerin …“", 179]]}, {"t": "Wiederherstellen", "text": ["Sie putzt das ganze Haus, geht fünfmal zum See, um Wasser zu holen, hängt die Türen wieder ein, stellt den Tisch zurück, „wo er immer gestanden hat“ (S. 179), bohnert den Boden. Als sie nach dem Putzen auf den Balkon tritt, ist draußen „alles, wie sie es immer gekannt hat“ (S. 178)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Am nächsten Tag putzt sie die Fenster …“", 179]], "deutung": "Sie stellt nicht einfach ein Haus wieder her, sondern ihre Kindheit – ein letztes Mal, kurz bevor es zerstört wird. Gegenbewegung zur Maklerin: Erinnerung gegen Markt."}, {"t": "Abschiedsritual", "text": ["„Niemals ist der Hausfrieden größer gewesen“ (S. 184) als am letzten Tag. In einer der Zeitungen, mit denen sie die Fenster poliert, stand, das Fegen galt bei den Azteken „als eine heilige Handlung“ (S. 184). Sie schließt „zurückweichend“ (S. 184) jede Tür, zuletzt die Haustür, und steckt den Schlüssel ein, „auch wenn der bald nur noch dazu da sein wird, Luft aufzuschließen“ (S. 185)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Niemals ist der Hausfrieden größer gewesen …“", 184], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„… und steckt den abgegriffenen Schlüssel ein …“", 185]], "deutung": "Ironie: „Hausfrieden“ (S. 184) ist auch ein Rechtsbegriff – juristisch begeht sie „verbotene Eigenmacht“ (S. 176), erlebt aber den größten Frieden im Haus."}]}, {"id": "b5", "title": "Sprache & Erzählweise", "task": "Analyse", "short": "Wie wird erzählt?", "intro": "Wie Erpenbeck den Konflikt zwischen Recht und Erinnerung schon in der Sprache sichtbar macht.", "kids": [{"t": "Montage", "text": ["Erinnerung und Gerichts-/Grundbuchsprache stehen unvermittelt nebeneinander. Beispiel: Sie öffnet, „Zug um Zug gegen Räumung“ (S. 176) …, „verbotene Eigenmacht“ (S. 176), „die Geheimtür ihrer Kinderzeit“ (S. 177)."], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Im Vögelchenzimmer, das sie ihre ganze Kindheit über …“", 176]], "deutung": "Die Sprache spiegelt den Konflikt: Das Recht dringt bis in ihre intimsten Erinnerungen ein."}, {"t": "Ohne Anführungszeichen", "text": ["Die juristischen Fragmente sind nicht als Zitat gekennzeichnet; oft sind es bloße Satzfetzen („Unstreitig.“ (S. 172), „Bestandskraft.“ (S. 176), „Abgegolten.“ (S. 173))."], "deutung": "Wirkung wie ein Bewusstseinsstrom: Das Verfahren hat sich in ihr Denken eingeschrieben, sie kann es nicht abschalten."}, {"t": "Personales Erzählen", "text": ["Ein Er-/Sie-Erzähler bleibt nah an ihrer Wahrnehmung. Andere Figuren (Maklerin, Kundschaft) erleben wir nur über das, was sie aus dem Schrank hört."], "deutung": "Wir sind mit ihr eingeschlossen – das verstärkt die Spannung der Schrank-Szene."}, {"t": "Zeitebenen", "text": ["Die Gegenwart (die letzten Wochen) steht im <b>Präsens<\/b> („Und jetzt will sie noch einmal ins Haus gehen“ (S. 173)), die Vorgeschichte im <b>Plusquamperfekt<\/b> („hatte sie sich nicht darüber gewundert“ (S. 174))."]}, {"t": "Ende im Amtsdeutsch", "text": ["Das Kapitel endet nicht mit ihr, sondern mit Fragmenten wie „Anlagenkonvolut B 3. Wir beantragen zu erkennen.“ (S. 185) – eine Antragsformel vor Gericht, nach der eigentlich der Antrag selbst folgen müsste. Er fehlt."], "deutung": "Das Recht behält das letzte Wort; ihre Geschichte wird zur Akte."}]}, {"id": "b6", "title": "Schlüsselstelle: Schlingen", "task": "Aufgabe 6", "short": "Wer wird woran gebunden?", "intro": "„Wie mit Schlingen band die Zeit den Ort dort fest, wo er war …“ (S. 183) – die zentrale Bildstelle des Kapitels.", "kids": [{"t": "Wer an was?", "text": ["Die Zeit bindet …", "• den Ort fest, „wo er war“ (S. 183)", "• die Erde an sich selbst", "• die Figur an diese Erde", "• sie und den Kinderfreund „für immer aneinander“ (S. 183) – obwohl sie ihn seit über neun Jahren nicht gesehen hat und ihm „wahrscheinlich nie wieder begegnen“ (S. 183) wird"], "belege": [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Wie mit Schlingen band die Zeit den Ort dort fest …“", 183]]}, {"t": "Umkehrung", "text": ["Grammatisch ist <b>die Zeit<\/b> das Subjekt, die Figur nur Objekt. Nicht sie hält den Ort fest, sondern sie wird festgehalten."], "deutung": "Sie ist dem Ort ausgeliefert – passend zum „sehr schönes Gefängnis“ (S. 183) direkt davor."}, {"t": "Doppeldeutigkeit", "text": ["Eine Schlinge verbindet – aber sie fängt auch (Falle, Strick). Die viermalige Wiederholung von „band … fest“ (S. 183) verstärkt das Gefühl, eingeschnürt zu sein."], "deutung": "Bindung gibt Halt und nimmt Freiheit – beides gleichzeitig."}, {"t": "Bedeutung fürs Ende", "text": ["Rechtlich verliert sie das Haus, physisch wird es abgerissen – die Bindung aber bleibt. Der Ort existiert danach nur noch in ihr (Schlüssel, der „Luft aufzuschließen“ (S. 185) wird). Dass die Erde „an sich selbst“ (S. 183) gebunden ist, verweist auf den Epilog: Am Ende bleibt nur die Landschaft."], "deutung": "Die Stelle beantwortet die Leitfrage auf ihre Weise: Der Ort gehört niemandem – aber er hält die fest, die ihn erlebt haben."}]}, {"id": "b7", "title": "Epilog & Rahmen", "task": "Aufgabe 5", "short": "Abriss und Kreis zum Prolog", "intro": "Was am Ende mit dem Haus passiert – und warum der Epilog so kalt erzählt ist.", "kids": [{"t": "Was passiert", "text": ["Das Haus wird abgerissen: Erst wird es entkernt (ca. 5 Mann, 3–5 Tage), dann mit einem Hydraulikbagger abgetragen (3 Mann, ca. anderthalb Wochen). Am Ende bleibt „nur noch eine Grube“ (S. 188)."], "belege": [["Epilog", "„Bei diesem Abriß …“", 186]]}, {"t": "Protokollstil", "text": ["Kursiv gesetzt, sachlich wie ein Fachtext, ohne Figuren und ohne Gefühle. Der Abriss läuft ab „wie bei allen anderen“ (S. 186) Abrissen."], "deutung": "Das Haus ist kein besonderer Ort mehr, sondern ein Fall unter vielen – die Kälte der Sprache macht den Verlust gerade spürbar."}, {"t": "Zahlen", "text": ["• ca. 900 m³ umbauter Raum", "• ca. 17 Lkw-Fahrten Schutt", "• Haupthaus „rund 500 Tonnen“ (S. 188), Badehaus „knapp 4 Tonnen“ (S. 188)"], "deutung": "Alles, was im Roman Bedeutung hatte (Schrank, Treppe, Türen), wird zu Gewicht und Volumen."}, {"t": "Kreis zum Prolog", "text": ["Im Prolog entsteht der See nach der Eiszeit und ist nur „etwas Zeitweiliges“ (S. 10); jede Hohlform ist „nur dazu da“ (S. 10), wieder zugeschüttet zu werden. Im Epilog bleibt eine Grube, und „für einen kurzen Moment“ (S. 188) gleicht die Landschaft „wieder sich selbst“ (S. 188), bevor ein anderes Haus gebaut wird."], "belege": [["Epilog", "„Bevor auf demselben Platz ein anderes Haus gebaut werden wird …“", 188], ["Prolog", "„… wie jede Hohlform war auch diese Rinne …“", 10]], "deutung": "Der Rahmen stellt die Menschengeschichte in die Erdgeschichte: Besitz, Recht und Erinnerung sind vorübergehend, die Landschaft bleibt."}]}, {"id": "b8", "title": "Beurteilung", "task": "AFB III", "short": "Unsere Bewertung", "intro": "Wir beziehen Stellung: Was lässt der Text offen, und wie bewerten wir es?", "kids": [{"t": "Opfer oder „unberechtigt“?", "pro": "Sie hat nichts Unrechtes getan, das Haus redlich bewohnt und verliert ihre Kindheit an Erben, die es nur verkaufen.", "contra": "Das Haus hat eine Vorgeschichte von Enteignungen; auch ihre Familie profitierte von einer früheren Enteignung (Architekt). Das Ufer kehrt zur „jüdischen Parzelle“ (S. 178) zurück.", "urteil": "Sie ist subjektiv Opfer, objektiv aber nur das letzte Glied in einer Kette. Der Roman verweigert bewusst eine einfache Opferrolle."}, {"t": "Recht vs. Gerechtigkeit", "pro": "„Rückgabe vor Entschädigung“ versucht, altes Unrecht rückgängig zu machen – das ist grundsätzlich gerecht.", "contra": "Das Recht fragt nicht nach gelebter Bindung („nicht streiterheblich“ (S. 172)). Am Ende gewinnt nicht die Erinnerung, sondern der Markt: verkauft, abgerissen.", "urteil": "Rechtlich korrekt, menschlich unbefriedigend. Erpenbeck zeigt, dass Recht und Gerechtigkeit nicht dasselbe sind."}, {"t": "Abschied oder Festklammern?", "pro": "Das Putzen ist ein Ritual (Azteken: „als eine heilige Handlung“ (S. 184)), sie gibt am Ende den Ort frei und schließt ab.", "contra": "Sie bricht das Recht („verbotene Eigenmacht“ (S. 176)), versteckt sich im Schrank und behält den Schlüssel.", "urteil": "Beides: Sie verabschiedet sich vom Haus, aber nicht von der Bindung – genau das sagt das Schlingen-Bild."}, {"t": "Ende: Trost oder Gleichgültigkeit?", "pro": "Die Landschaft „gleicht … wieder sich selbst“ (S. 188) – alles kehrt zum Ursprung zurück, ein ruhiger Schluss.", "contra": "Die Natur ist gleichgültig gegenüber den Menschen, und der Satz beginnt mit „Bevor auf demselben Platz ein anderes Haus gebaut werden wird“ (S. 188) – der Kreislauf von Besitz geht einfach weiter.", "urteil": "Für uns eher nüchtern als tröstlich: Der Roman relativiert alle Besitzansprüche, auch den der Enkelin."}, {"t": "Antwort auf die Leitfrage", "text": ["Wem gehört der Ort? <b>Rechtlich<\/b> den Erben, <b>emotional<\/b> der Enkelin, <b>auf Dauer<\/b> niemandem. Schon im Kapitel steht das Wort „Verliehen.“ (S. 175) – Besitz ist im Roman immer nur geliehen.", "Erpenbeck selbst sagt im Interview, schon das Hoffen auf Heimat sei „sozusagen schon der Fehler“ (Interview mit Planet Interview, 1. 9. 2008; zitiert nach Ingo Kammerer: Reclam Literaturunterricht – Jenny Erpenbeck, Heimsuchung, 2024, S. 82)."], "deutung": "Genau das zeigt das Kapitel: Die Enkelin hofft, den Ort zu behalten – und verliert ihn trotzdem. Erst der Verlust macht ihr die Bindung bewusst."}]}], "rel": {"nodes": [["enk", "Enkelin", "die unberechtigte Eigenbesitzerin", "Hauptfigur. Verliert das Haus ihrer Kindheit nach der Wende, schleicht sich ein letztes Mal hinein und verabschiedet sich.", 0, 0], ["oma", "Großmutter", "die Schriftstellerin", "Aus dem sowjetischen Exil zurückgekehrt, lebte in der DDR im Haus. Nach ihrem Tod wird die Enkelin Miteigentümerin. Ihr Geruch (Pfefferminz, Kampfer) ist noch im Schrankzimmer.", -420, -210], ["vat", "Vater", "Sohn der Schriftstellerin", "Im Exil geboren, vier Jahre im Kinderheim. Verachtet „Natur“ (S. 174), lässt die Tochter als Miteigentümerin eintragen und fährt nach dem Rückgabeantrag nie wieder hin.", -450, 90], ["mann", "Ehemann", "", "„Du hast deine Zeit dort gehabt.“ (S. 183) – versteht ihre Bindung nicht.", -260, 330], ["kf", "Kinderfreund", "", "Begleitete mit ihr das Badehaus den Hang hinauf, half beim Ausräumen und entdeckte den Schwamm. Sie sieht ihn heimlich vom Fenster aus, trifft ihn aber nicht. Durch die „Schlingen“ (S. 183) „für immer“ (S. 183) mit ihr verbunden.", 170, 340], ["erb", "Erben der Frau des Architekten", "Erbengemeinschaft", "Leben im Westen (Österreich, Schweiz, Westdeutschland). Beantragen die Rückübertragung und lassen das Haus verkaufen.", 420, -210], ["mak", "Maklerin", "", "Verkauft das Haus als Ware („das bessere Ufer“ (S. 180), „Gruppe Albert Speer“ (S. 180)), 6 % Provision. Führt Kunden durchs Haus, während die Enkelin im Schrank liegt.", 450, 90], ["neu", "Neue Eigentümer", "+ ihr Architekt", "Betreten das Haus nicht mehr, zeigen nur „auf den Platz“ (S. 183) – lassen es abreißen.", 470, 350], ["arch", "Architekt", "Vorgeschichte (frühere Kapitel)", "Baute das Haus. Seine Frau ist die Erblasserin. Im Roman ist er schon selbst Teil einer Kette von Enteignungen.", -30, -420]], "edges": [["oma", "enk", "vererbt ihr das Haus"], ["oma", "vat", "Mutter"], ["vat", "enk", "lässt sie eintragen"], ["mann", "enk", "„Du hast deine Zeit dort gehabt“ (S. 183)"], ["kf", "enk", "Schlingen: „für immer aneinander“ (S. 183)"], ["erb", "enk", "klagen auf Herausgabe"], ["erb", "mak", "beauftragen"], ["mak", "neu", "verkauft an"], ["arch", "erb", "Erben seiner Frau"], ["mak", "enk", "führt Kunden vorbei, während sie im Schrank liegt"]]}, "relP": {"arch": [0, -700], "oma": [-175, -490], "erb": [175, -490], "vat": [-215, -230], "mak": [200, -250], "enk": [0, 0], "mann": [-215, 260], "kf": [0, 350], "neu": [230, 350]}, "tl": [["snow", "land", "vor der Geschichte", false, "Eiszeit: der See entsteht", "Im Prolog formt das Eis eine Rinne, in der sich der See sammelt. Schon hier steht, dass der See „nur etwas Zeitweiliges“ (S. 10) ist: Jede Hohlform wird irgendwann wieder zugeschüttet.", [["Prolog", "„… wie jede Hohlform war auch diese Rinne …“", 10]]], ["sun", "mensch", "ca. 1970er", true, "Kindheit am See", "Als Kind verbringt sie alle Sommerferien im Vögelchenzimmer der Großmutter. Mit dem Kinderfreund begleitet sie die Arbeiter, als das Badehaus den Hang hinaufgezogen wird.", [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Im Vögelchenzimmer, das sie ihre ganze Kindheit über …“", 176], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Jetzt denkt sie daran, wie ihre Großmutter …“", 181]]], ["candle", "mensch", "Zeitpunkt nicht genannt", true, "Tod der Großmutter", "Sie sucht das schönste Nachthemd der Großmutter für die Aufbahrung heraus. Danach lässt der Vater sie „gleich als Miteigentümerin“ (S. 174) eintragen. Wann genau, sagt der Text nicht. Während des Verfahrens gehört das Haus aber „offiziell noch ihnen“ (S. 174).", [["Kap. „Die unberechtigte Eigenbesitzerin“", "„Noch während ihre Großmutter im Sterben lag …“", 184], ["Kap. „Die unberechtigte Eigenbesitzerin“", "„Deshalb hatte sie sich nicht darüber gewundert …“", 174]]], ["wall", "recht", "1990", true, "Wende und Währungsunion", "Mit der „Halbierung der ostdeutschen Konten“ (S. 174) fehlt der Familie das Geld, um
